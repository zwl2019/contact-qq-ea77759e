<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系客服</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f3ff, #f5f7fa);
    }

    .contact-card {
      padding: 40px 60px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .contact-card h1 {
      margin: 0 0 20px;
      color: #333333;
      font-size: 28px;
    }

    .qq-number {
      margin: 0;
      color: #1677ff;
      font-size: 24px;
      font-weight: bold;
      user-select: all;
    }
  </style>
</head>
<body>
  <main class="contact-card">
    <h1>联系客服</h1>
    <p class="qq-number">客服QQ：1525872150</p>
  </main>
</body>
</html>
